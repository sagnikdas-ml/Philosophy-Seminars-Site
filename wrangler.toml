name = "early-modern-lab-seminars"
main = "worker.js"
compatibility_date = "2026-09-21"

[vars]
# The published CSV export for the same sheet used by Apps Script.
GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1lb5uZfeaZEmB-ZH7DwzFFtzEIX2ItcwUX8Mvza0pxp0/export?format=csv&gid=0"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
